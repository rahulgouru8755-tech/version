name: CI/CD Deploy Java App to Tomcat10 on EC2

on:
  push:
    branches:
      - master

env:
  WAR_NAME: ROOT.war
  EC2_USER: ubuntu
  TOMCAT_PATH: /var/lib/tomcat10/webapps
  TEMP_PATH: /tmp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # 3. Build the WAR file
      - name: Build WAR file
        run: mvn clean package -DskipTests

      # 4. Verify WAR file exists
      - name: Verify WAR file
        run: |
          echo "=== Checking for WAR files in target directory ==="
          ls -la target/

          WAR_FILE=$(ls target/*.war | head -1 || true)
          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: No WAR file found!"
            exit 1
          fi

          echo "Found WAR file: $WAR_FILE"
          cp "$WAR_FILE" "./${WAR_NAME}"
          ls -la "./${WAR_NAME}"

      # 5. Upload WAR to EC2 (using scp-action)
      - name: Upload WAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./${{ env.WAR_NAME }}"
          target: "${{ env.TEMP_PATH }}/${{ env.WAR_NAME }}"

      # 6. Verify WAR file exists on EC2
      - name: Verify file on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Verifying WAR file in ${{ env.TEMP_PATH }} ==="
            if [ ! -f "${{ env.TEMP_PATH }}/${{ env.WAR_NAME }}" ]; then
              echo "ERROR: WAR file not found on EC2!"
              exit 1
            fi
            ls -lh "${{ env.TEMP_PATH }}/${{ env.WAR_NAME }}"
            file "${{ env.TEMP_PATH }}/${{ env.WAR_NAME }}"

      # 7. Deploy WAR on Tomcat
      - name: Deploy WAR on Tomcat
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Starting Deployment on Tomcat10 ==="

            echo "1. Stopping Tomcat..."
            sudo systemctl stop tomcat10 || true

            echo "2. Cleaning old deployment..."
            sudo rm -rf "${{ env.TOMCAT_PATH }}/ROOT" "${{ env.TOMCAT_PATH }}/${{ env.WAR_NAME }}"

            echo "3. Copying new WAR file..."
            sudo cp "${{ env.TEMP_PATH }}/${{ env.WAR_NAME }}" "${{ env.TOMCAT_PATH }}/"
            sudo chown tomcat:tomcat "${{ env.TOMCAT_PATH }}/${{ env.WAR_NAME }}"
            sudo chmod 644 "${{ env.TOMCAT_PATH }}/${{ env.WAR_NAME }}"

            echo "4. Starting Tomcat..."
            sudo systemctl start tomcat10

            echo "5. Waiting for Tomcat to start..."
            sleep 30

            echo "6. Checking Tomcat status..."
            sudo systemctl status tomcat10 --no-pager

            echo "7. Verifying deployment..."
            ls -lh "${{ env.TOMCAT_PATH }}/"
            curl -f http://localhost:8080/ || echo "WARNING: App might not be responding yet."

            echo "=== Deployment Completed Successfully ==="
